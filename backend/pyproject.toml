[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoopcouncil"
version = "0.1.0"
description = "Multi-agent, data-grounded basketball strategy simulation"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "SQLAlchemy>=2.0.25",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hoop = "hoopcouncil.cli:main"

[tool.setuptools.packages.find]
include = ["hoopcouncil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
